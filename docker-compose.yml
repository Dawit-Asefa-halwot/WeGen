version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wegen_postgres
    restart: always
    environment:
      POSTGRES_USER: wegen_user
      POSTGRES_PASSWORD: wegen_secret_pass
      POSTGRES_DB: wegen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wegen_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
